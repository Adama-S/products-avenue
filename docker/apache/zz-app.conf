# Loaded after the image's security.conf (alphabetical order), so these values win.
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html/public>
    AllowOverride None
    Require all granted
    # Front Controller: every URL that is not a real file goes to index.php.
    FallbackResource /index.php
</Directory>

# Keep the application's ETag on gzip responses: by default mod_deflate appends "-gzip",
# so a browser's If-None-Match never matches and the catalogue never gets its 304.
# The application sends a weak ETag (W/), valid for both encodings.
DeflateAlterETag NoChange
