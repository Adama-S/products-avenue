; Production-like settings: errors are logged, never displayed.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; stderr ends up in `docker compose logs app`.
error_log = /dev/stderr
error_reporting = E_ALL

; Dates are stored and handled in UTC, converted to Europe/Paris only for display.
date.timezone = UTC

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
